plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Versão automática: cada build gera versionCode único (segundos desde
// 01/01/2026, cabe num int por ~68 anos) e versionName com data/hora.
def now = new Date()
def epoch = new Date(126, 0, 1) // 2026-01-01
def buildNumber = ((now.time - epoch.time) / 1000).toInteger()
def stamp = now.format('yyyyMMdd-HHmm')

// Assinatura do APK release (instalável fora da Play). As chaves vêm de:
//  1) local.properties (build na sua máquina - gitignored), ou
//  2) variáveis de ambiente (usado pelo GitHub Actions, com o keystore
//     gravado a partir do secret RELEASE_KEYSTORE_BASE64).
// Sem nenhuma das duas, o release sai app-release-unsigned.apk.
def ksProps = new Properties()
def ksFile = rootProject.file("local.properties")
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}
def ksStoreFile = System.getenv("RELEASE_STORE_FILE")?.trim() ?: ksProps.getProperty("release.storeFile")?.trim()
def ksStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: ksProps.getProperty("release.storePassword")
def ksKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: ksProps.getProperty("release.keyAlias")
def ksKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: ksProps.getProperty("release.keyPassword")
def hasReleaseKs = ksStoreFile && ksStorePassword && ksKeyAlias && ksKeyPassword

if (!hasReleaseKs) {
    logger.lifecycle("Assinatura release: SEM chaves (sai app-release-unsigned.apk). Debug nao e afetado.")
}

android {
    namespace 'com.exemplo.countdownwallpaper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.exemplo.countdownwallpaper'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${stamp}"
    }

    signingConfigs {
        release {
            if (hasReleaseKs) {
                storeFile file(ksStoreFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKs) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}
