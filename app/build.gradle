plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Versão automática: cada build gera versionCode único (segundos desde
// 01/01/2026, cabe num int por ~68 anos) e versionName com data/hora.
def now = new Date()
def epoch = new Date(126, 0, 1) // 2026-01-01
def buildNumber = ((now.time - epoch.time) / 1000).toInteger()
def stamp = now.format('yyyyMMdd-HHmm')

// Assinatura do APK release (instalável fora da Play): chaves em
// local.properties (gitignored). Sem elas, o release sai unsigned.
def ksProps = new Properties()
def ksFile = rootProject.file("local.properties")
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}
def hasReleaseKs = ksProps.getProperty("release.storeFile")?.trim()

android {
    namespace 'com.exemplo.countdownwallpaper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.exemplo.countdownwallpaper'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${stamp}"
    }

    signingConfigs {
        release {
            if (hasReleaseKs) {
                storeFile file(hasReleaseKs)
                storePassword ksProps.getProperty("release.storePassword")
                keyAlias ksProps.getProperty("release.keyAlias")
                keyPassword ksProps.getProperty("release.keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKs) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}
